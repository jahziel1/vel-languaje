[workspace]

[package]
name    = "vel-renderer-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
console_error_panic_hook = "0.1"

# web-sys features: everything the renderer needs from the browser
[dependencies.web-sys]
version  = "0.3"
features = [
  "Window", "Document", "HtmlCanvasElement",
  "OffscreenCanvas", "OffscreenCanvasRenderingContext2d",
  "ImageData", "CanvasRenderingContext2d",
]

# wgpu with WebGPU backend (wasm32 target selects it automatically)
[dependencies.wgpu]
version  = "23"
default-features = false
features = ["wgsl", "webgpu"]

[profile.release]
opt-level = "s"
lto       = true
